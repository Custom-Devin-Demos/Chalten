name: Java

on:
  push:
    paths:
      - 'java/**'
      - '.github/workflows/java.yml'
  pull_request:
    paths:
      - 'java/**'
      - '.github/workflows/java.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: java-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Gradle build (Java 21)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      - name: Build and test
        run: ./gradlew build --stacktrace
      - name: Coverage summary
        if: always()
        run: python3 scripts/coverage-summary.py . >> "$GITHUB_STEP_SUMMARY"
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-reports
          path: |
            java/*/build/reports/tests/
            java/*/build/test-results/
          if-no-files-found: warn
      - name: Upload JaCoCo reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: jacoco-reports
          path: |
            java/build/reports/jacoco/
            java/*/build/reports/jacoco/
          if-no-files-found: warn
